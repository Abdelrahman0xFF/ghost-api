<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <style>
            :root {
                --bg: #0d1117;
                --card: #161b22;
                --border: #30363d;
                --text: #c9d1d9;
                --text-dim: #8b949e;
                --primary: #58a6ff;
                --success: #3fb950;
                --warning: #d29922;
                --danger: #f85149;
                --get: #61affe;
                --post: #49cc90;
                --put: #fca130;
                --delete: #f93e3e;
            }

            body {
                font-family:
                    -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica,
                    Arial, sans-serif;
                background: var(--bg);
                color: var(--text);
                padding: 0;
                margin: 0;
                font-size: 13px;
                line-height: 1.5;
            }

            .header {
                position: sticky;
                top: 0;
                background: rgba(13, 17, 23, 0.95);
                backdrop-filter: blur(8px);
                padding: 12px 16px;
                border-bottom: 1px solid var(--border);
                z-index: 100;
            }

            .top-bar {
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-bottom: 12px;
            }

            .logo {
                display: flex;
                align-items: center;
                gap: 8px;
                font-weight: 600;
                letter-spacing: -0.5px;
            }

            .dot {
                width: 8px;
                height: 8px;
                background: var(--success);
                border-radius: 50%;
                box-shadow: 0 0 8px var(--success);
                animation: pulse 2s infinite;
            }

            @keyframes pulse {
                0% { opacity: 1; }
                50% { opacity: 0.4; }
                100% { opacity: 1; }
            }

            .search-container {
                display: flex;
                gap: 8px;
            }

            input#search {
                flex: 1;
                background: #010409;
                border: 1px solid var(--border);
                border-radius: 6px;
                color: white;
                padding: 6px 10px;
                font-size: 12px;
                outline: none;
            }

            input#search:focus {
                border-color: var(--primary);
            }

            .btn {
                background: var(--card);
                border: 1px solid var(--border);
                color: var(--text);
                padding: 6px 12px;
                border-radius: 6px;
                cursor: pointer;
                font-size: 11px;
                font-weight: 500;
                transition: all 0.2s;
            }

            .btn:hover {
                background: #21262d;
                border-color: #8b949e;
            }
            .btn-danger {
                color: var(--danger);
            }
            .btn-danger:hover {
                background: rgba(248, 81, 73, 0.1);
                border-color: var(--danger);
            }

            #container {
                padding: 8px 16px 16px;
            }

            .log-item {
                background: var(--card);
                border: 1px solid var(--border);
                border-radius: 8px;
                margin-bottom: 12px;
                overflow: hidden;
                transition: transform 0.1s;
            }

            .log-item:hover {
                border-color: #444;
            }

            .log-header {
                padding: 10px;
                display: flex;
                align-items: center;
                gap: 10px;
                border-bottom: 1px solid var(--border);
                background: rgba(255, 255, 255, 0.02);
            }

            .badge {
                font-size: 10px;
                font-weight: 800;
                padding: 2px 6px;
                border-radius: 4px;
                text-transform: uppercase;
                min-width: 45px;
                text-align: center;
            }

            .badge.GET {
                background: rgba(97, 175, 254, 0.1);
                color: var(--get);
            }
            .badge.POST {
                background: rgba(73, 204, 144, 0.1);
                color: var(--post);
            }
            .badge.PUT {
                background: rgba(252, 161, 48, 0.1);
                color: var(--put);
            }
            .badge.DELETE {
                background: rgba(249, 62, 62, 0.1);
                color: var(--delete);
            }

            .url {
                font-family:
                    "SFMono-Regular", Consolas, "Liberation Mono", Menlo,
                    monospace;
                font-size: 11px;
                color: var(--primary);
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
                flex: 1;
            }

            .payload-section {
                padding: 10px;
                background: #010409;
            }

            .payload-header {
                display: flex;
                justify-content: space-between;
                font-size: 10px;
                color: var(--text-dim);
                margin-bottom: 6px;
                text-transform: uppercase;
                font-weight: 600;
            }

            .copy-link {
                color: var(--primary);
                cursor: pointer;
                text-decoration: none;
            }

            .copy-link:hover {
                text-decoration: underline;
            }

            pre {
                margin: 0;
                font-size: 11px;
                color: var(--success);
                overflow-x: auto;
                max-height: 200px;
                white-space: pre-wrap;
            }

            .empty-state {
                text-align: center;
                margin-top: 60px;
                color: var(--text-dim);
            }
        </style>
    </head>
    <body>
        <div class="header">
            <div class="top-bar">
                <div class="logo">
                    <div class="dot"></div>
                    <span>Ghost API</span>
                </div>
                <button id="clear-btn" class="btn btn-danger">Clear All</button>
            </div>
            <div class="search-container">
                <input
                    type="text"
                    id="search"
                    placeholder="Filter by URL or Keyword..."
                />
            </div>
        </div>

        <div id="container">
            <div class="empty-state">
                <p>Waiting for API requests...</p>
                <small>Refresh the website to start sniffing</small>
            </div>
        </div>

        <script src="panel.js"></script>
    </body>
</html>
